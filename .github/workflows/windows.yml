name: Windows build

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de publicat, de exemplu v1.0.0 (opțional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build portable executable
        shell: pwsh
        run: .\build-portable.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foto-cleaner-windows
          path: dist/Foto-cleaner.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: Foto-cleaner-windows
          path: release

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -LiteralPath "release\Foto-cleaner.exe" -DestinationPath "Foto-cleaner-windows.zip"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "Foto-cleaner-windows.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "Foto-cleaner-windows.zip" --generate-notes --title "Foto Cleaner $RELEASE_TAG"
          fi
